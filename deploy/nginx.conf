# Example only. Set your domain, certificate paths, and access policy.
server {
    listen 80;
    server_name notes.example.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name notes.example.com;
    ssl_certificate /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /download/quiccie.apk {
        alias /opt/quiccie/releases/quiccie.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="quiccie.apk"';
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8090; }
    location /assets/ {
        alias /opt/quiccie/web/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        root /opt/quiccie/web/current;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
